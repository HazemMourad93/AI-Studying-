name: Publish CT-AI Arabic and English PDFs
on:
  push:
    branches: [main]
    paths:
      - 'ctai-summaries/ar.html'
      - 'ctai-summaries/en.html'
      - '.github/workflows/publish-ctai-summary-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install HTML-to-PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev fonts-dejavu-core fonts-noto-core
          python -m pip install weasyprint==68.0 pypdf beautifulsoup4
      - name: Generate and validate the separate language PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from bs4 import BeautifulSoup
          from weasyprint import HTML
          from pypdf import PdfReader, PdfWriter

          for lang,label in [('ar','Arabic'), ('en','English')]:
              path=Path('ctai-summaries')/(lang+'.html')
              soup=BeautifulSoup(path.read_text(encoding='utf-8'),'html.parser')
              intro=soup.select_one('section.cover')
              chapters=soup.select('article.chapter')
              if not intro or len(chapters)!=7:
                  raise RuntimeError(f'Missing cover or chapters in {path}: {len(chapters)}')
              head=str(soup.head)
              writer=PdfWriter()
              for name,article in [('cover',intro)]+[(f'chapter_{n}',c) for n,c in enumerate(chapters,1)]:
                  markup=f'<!doctype html><html lang="{lang}">{head}<body class="{lang}"><div class="container">{article}</div></body></html>'
                  pdf=HTML(string=markup,base_url=str(path.parent.resolve())).write_pdf()
                  pages=len(PdfReader(BytesIO(pdf)).pages)
                  if (name=='cover' and pages>2) or (name!='cover' and pages>5):
                      raise RuntimeError(f'{lang} {name} has {pages} pages — exceeds limit')
                  start=len(writer.pages)
                  writer.append(BytesIO(pdf),import_outline=False)
                  if name.startswith('chapter_'):
                      writer.add_outline_item(f'Chapter {name.split("_")[1]}', start)
                  print(f'{lang} {name}: {pages} pages')
              writer.add_metadata({'/Title':f'ISTQB CT-AI v2.0 - {label} Chapter Summaries'})
              target=Path('ctai-summaries')/f'CTAI_v2_{label}.pdf'
              with target.open('wb') as out:writer.write(out)
              print(f'Generated {target} with {len(writer.pages)} total pages')
          PY
      - name: Commit both PDF files
        run: |
          if [[ -n "$(git status --porcelain -- ctai-summaries/CTAI_v2_Arabic.pdf ctai-summaries/CTAI_v2_English.pdf)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ctai-summaries/CTAI_v2_Arabic.pdf ctai-summaries/CTAI_v2_English.pdf
            git commit -m "Publish validated CT-AI Arabic and English PDFs [skip ci]"
            git push
          else
            echo "PDFs are already current."
          fi
